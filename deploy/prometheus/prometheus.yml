global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: video-service
    dns_sd_configs:
      - names: ["video-service"]
        type: A
        port: 8082

  # Descobre todas as réplicas do worker via DNS do Docker/K8s headless service.
  - job_name: processor-worker
    dns_sd_configs:
      - names: ["processor-worker"]
        type: A
        port: 8083

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:8084"]

  # Plugin rabbitmq_prometheus: profundidade das filas, publish/deliver rates.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
