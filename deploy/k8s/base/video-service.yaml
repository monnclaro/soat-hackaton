apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-service
  labels: { app: video-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: video-service }
  template:
    metadata:
      labels: { app: video-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: video-service
          image: fiapx/video-service
          ports: [{ containerPort: 8082, name: http }]
          envFrom: [{ configMapRef: { name: fiapx-config } }]
          env:
            - { name: PORT, value: "8082" }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: fiapx-secrets, key: JWT_SECRET } } }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: fiapx-secrets, key: VIDEO_DATABASE_URL } } }
            - { name: RABBITMQ_URL, valueFrom: { secretKeyRef: { name: fiapx-secrets, key: RABBITMQ_URL } } }
            - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: fiapx-secrets, key: S3_ACCESS_KEY } } }
            - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: fiapx-secrets, key: S3_SECRET_KEY } } }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 200m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
apiVersion: v1
kind: Service
metadata:
  name: video-service
spec:
  selector: { app: video-service }
  ports: [{ port: 8082, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: video-service
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: video-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
