apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels: { app: notification-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: notification-service
          image: fiapx/notification-service
          ports: [{ containerPort: 8084, name: http }]
          envFrom: [{ configMapRef: { name: fiapx-config } }]
          env:
            - { name: PORT, value: "8084" }
            - { name: RABBITMQ_URL, valueFrom: { secretKeyRef: { name: fiapx-secrets, key: RABBITMQ_URL } } }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 15 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector: { app: notification-service }
  ports: [{ port: 8084, targetPort: http, name: http }]
