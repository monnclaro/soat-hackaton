# Worker: cada pod processa WORKER_CONCURRENCY vídeos em paralelo; o HPA adiciona pods
# conforme a CPU (ffmpeg é CPU-bound). Com KEDA instalado, prefira escalar pela profundidade
# da fila (ver keda-scaledobject.yaml em deploy/k8s/optional).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor-worker
  labels: { app: processor-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: processor-worker }
  template:
    metadata:
      labels: { app: processor-worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
    spec:
      # Tempo para terminar o vídeo em andamento no scale-down/deploy (mensagem só recebe ack ao final;
      # se o pod morrer antes, o RabbitMQ reentrega para outra réplica).
      terminationGracePeriodSeconds: 600
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: processor-worker
          image: fiapx/processor-worker
          ports: [{ containerPort: 8083, name: http }]
          envFrom: [{ configMapRef: { name: fiapx-config } }]
          env:
            - { name: PORT, value: "8083" }
            - { name: WORKER_CONCURRENCY, value: "2" }
            - { name: FRAME_FPS, value: "1" }
            - { name: MAX_ATTEMPTS, value: "3" }
            - { name: JOB_TIMEOUT, value: "30m" }
            - { name: WORK_DIR, value: /work }
            - { name: RABBITMQ_URL, valueFrom: { secretKeyRef: { name: fiapx-secrets, key: RABBITMQ_URL } } }
            - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: fiapx-secrets, key: S3_ACCESS_KEY } } }
            - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: fiapx-secrets, key: S3_SECRET_KEY } } }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 15 }
          resources:
            requests: { cpu: 500m, memory: 256Mi, ephemeral-storage: 2Gi }
            limits: { cpu: "2", memory: 1Gi, ephemeral-storage: 10Gi }
          volumeMounts: [{ name: work, mountPath: /work }]
          securityContext: { allowPrivilegeEscalation: false }
      volumes:
        - name: work
          emptyDir: { sizeLimit: 10Gi }
---
# Headless: o Prometheus descobre cada réplica individualmente.
apiVersion: v1
kind: Service
metadata:
  name: processor-worker
spec:
  clusterIP: None
  selector: { app: processor-worker }
  ports: [{ port: 8083, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: processor-worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: processor-worker }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
