# Ambiente local completo (minikube/kind): aplicações + infraestrutura em pods.
#   kubectl apply -k deploy/k8s/local
# Em nuvem, use a base (deploy/k8s/base) apontando para serviços gerenciados
# (RDS PostgreSQL, ElastiCache Redis, Amazon MQ RabbitMQ, S3, SES).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fiapx

resources:
  - ../base
  - infra.yaml

configMapGenerator:
  - name: postgres-init
    files:
      - init.sql
generatorOptions:
  disableNameSuffixHash: true
