# Ambiente local completo (minikube/kind): aplicações + infraestrutura em pods.
#   kubectl apply -k deploy/k8s/local
# Para usar serviços gerenciados, aplique só a base (deploy/k8s/base) apontando para eles
# (PostgreSQL, Redis, RabbitMQ, storage compatível com S3 e SMTP de qualquer provedor).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fiapx

resources:
  - ../base
  - infra.yaml

configMapGenerator:
  - name: postgres-init
    files:
      - init.sql
generatorOptions:
  disableNameSuffixHash: true
